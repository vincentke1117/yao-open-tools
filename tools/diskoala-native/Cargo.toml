[workspace]
resolver = "2"
members = ["crates/diskoala-core", "crates/diskoala-cli", "apps/diskoala-gui/src-tauri"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
